
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpg" href="img/logo.png">

    <title>Sindicato Carls Jr</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
    <form id="formLogin">

        <div>
            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                required
            >
        </div>

        <div>
            <label for="contrasena">Contraseña</label>
            <input
                type="password"
                id="contrasena"
                name="contrasena"
                required
            >
        </div>

        <button type="submit" class="boton-principal">
            Iniciar sesión
        </button>

        <button type="button" id="btnActivar" class="boton-secundario">
            Activar mi cuenta
        </button>

        <a href="#" id="btnRecuperar" class="link">¿Olvidaste tu contraseña?</a>    
        

    </form>

    <section id="seccionActivar" hidden>
        <h2>ACTIVACION DE CUENTA</h2>

        <form id="formularioActivacion">
            <div>
                <label for="correoActivacion">Correo electrónico</label>
                <input
                    type="email"
                    id="correoActivacion"
                    name="correoActivacion"
                    required
                >
            </div>

            <div>
                <label for="codigoActivacion">Codigo de activacion</label>
                <input 
                type="text" 
                name="codigoActivacion" 
                id="codigoActivacion"
                required
                >
            </div>

            <div>
                <label for="nuevaContrasena">Ingresa la nueva contraseña</label>
                <input
                    type="password"
                    id="nuevaContrasena"
                    name="nuevaContrasena"
                    minlength="8"
                    required
                >
            </div>

            <div>
                <label for="confNuevaContrasena">Confirma la nueva contraseña</label>
                <input
                    type="password"
                    id="confNuevaContrasena"
                    name="confNuevaContrasena"
                    minlength="8"
                    required
                >
            </div>

            <p id="mensajeActivacion" role="status"></p>

            <button type="submit">
                Activar cuenta
            </button>
                    
            <button type="button" class="btnVolver">
                Volver
            </button>
        </form>
    </section>

    <section id="seccionRecuperar" hidden>

        <h2>Recuperar contraseña</h2>

        <label for="correoRecuperacion">
            Correo electrónico
        </label>
        
        <form id="formularioRecuperacion">
            <input 
                type="email"
                id="correoRecuperacion"
                name="correoRecuperacion"
                required
            >
            <p id="mensajeRecuperacion" role="status"></p>
            
            <button type="submit">
                Solicitar recuperacion
            </button>
        </form>

        
        
        <p>
            Tu solicitud debe ser aprobada
            por un administrador.
        </p>

        <button type="button" class="btnVolver">
            Volver
        </button>

    </section>
    
    <script src="script.js"></script>
    </main>
</body>
</html>
